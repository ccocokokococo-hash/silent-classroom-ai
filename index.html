<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Silent Classroom AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">

<div class="login-card">
  <div class="logo">SC</div>
  <h1>Silent Classroom AI</h1>
  <p>Digital platform for activating passive English learners.</p>

  <h3>Student Login</h3>
  <input id="studentName" placeholder="Student full name">

  <select id="studentGrade">
    <option value="6">Grade 6</option>
    <option value="7">Grade 7</option>
  </select>

  <select id="studentLevel">
    <option value="support">Needs support</option>
    <option value="average">Average</option>
    <option value="confident">Confident</option>
  </select>

  <button onclick="studentLogin()">Enter Student Panel</button>

  <hr>

  <h3>Teacher Login</h3>
  <input id="teacherPassword" type="password" placeholder="Password: 1234">
  <button class="secondary" onclick="teacherLogin()">Enter Teacher Panel</button>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>

<script src="https://static.elfsight.com/platform/platform.js" async></script>
<div class="elfsight-app-YOUR_ELFSIGHT_ID"></div>
</body>
</html>
